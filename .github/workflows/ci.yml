name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore TypesafeSdk.slnx

      - run: dotnet build TypesafeSdk.slnx -c Release --no-restore

      - run: dotnet test --solution TypesafeSdk.slnx -c Release --no-build

      - run: dotnet pack src/TypesafeSdk/TypesafeSdk.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # --skip-duplicate keeps the job green when the version in the csproj hasn't been bumped.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
